# Studio dependency maintenance. Security-update PRs are enabled separately in repository settings.
# Routine minor/patch updates are grouped; security fixes and major upgrades remain separate.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: America/New_York
  open-pull-requests-limit: 3
  groups:
    routine-minor-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
